[obstacles.auto]
root = "/World"
name_prefix = "radiation_obstacle_"

# 파일에서 실제로 "_stainlessSteel", "_boratedConcrete", "_concrete", "_aluminium" 꼬리가 존재하므로
# 마지막 '_' 뒤를 material 키로 사용
material_from_name_suffix = true

# (옵션) suffix가 숫자로 끝나는 경우(…_1, …_2)는 숫자를 버리고 그 앞 토큰을 material로 사용
ignore_trailing_numeric_suffix = true

# (예외가 생기면 아래처럼 override만 추가)
# [[obstacles.override]]
# path = "/World/SomePrim"
# material = "concrete"